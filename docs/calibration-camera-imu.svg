<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">Camera–IMU calibration pipeline</title>
  <desc id="description">Diagram of the inputs, checks, AprilGrid detection, initialization, joint optimization, validation, and outputs of calib_imu_camera.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, DejaVu Sans, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, DejaVu Sans, sans-serif; fill: #475569; }
      .section { font: 700 15px Inter, DejaVu Sans, sans-serif; letter-spacing: 1.5px; fill: #64748b; }
      .box-title { font: 700 21px Inter, DejaVu Sans, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Inter, DejaVu Sans, sans-serif; fill: #334155; }
      .small { font: 400 14px Inter, DejaVu Sans, sans-serif; fill: #475569; }
      .tag { font: 700 13px Inter, DejaVu Sans, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 18; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="url(#background)"/>
  <text x="80" y="64" class="title">Camera–IMU calibration: from dataset to extrinsics</text>
  <text x="80" y="96" class="subtitle">Pipeline implemented by calib_imu_camera — monocular, global shutter</text>

  <text x="80" y="142" class="section">1 — INPUTS</text>
  <rect x="80" y="164" width="330" height="138" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <rect x="101" y="184" width="87" height="25" rx="12" fill="#0284c7"/>
  <text x="119" y="202" class="tag">CAMERA</text>
  <text x="104" y="238" class="box-title">Timestamped images</text>
  <text x="104" y="268" class="body">cam0/&lt;timestamp_ns&gt;.png</text>
  <text x="104" y="290" class="small">Pixels + camera clock</text>

  <rect x="450" y="164" width="330" height="138" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <rect x="471" y="184" width="65" height="25" rx="12" fill="#7c3aed"/>
  <text x="487" y="202" class="tag">IMU</text>
  <text x="474" y="238" class="box-title">Inertial measurements</text>
  <text x="474" y="268" class="body">ω [rad/s] · a [m/s²]</text>
  <text x="474" y="290" class="small">imu0/imu0.csv · timestamps ns</text>

  <rect x="820" y="164" width="330" height="138" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="841" y="184" width="63" height="25" rx="12" fill="#16a34a"/>
  <text x="858" y="202" class="tag">TARGET</text>
  <text x="844" y="238" class="box-title">AprilGrid geometry</text>
  <text x="844" y="268" class="body">IDs · size · spacing</text>
  <text x="844" y="290" class="small">World frame W and metric scale</text>

  <rect x="1190" y="164" width="330" height="138" class="box" fill="#fef3c7" stroke="#d97706"/>
  <rect x="1211" y="184" width="129" height="25" rx="12" fill="#d97706"/>
  <text x="1227" y="202" class="tag">CONFIGURATION</text>
  <text x="1214" y="238" class="box-title">Optics and IMU noise</text>
  <text x="1214" y="268" class="body">camchain or camera model</text>
  <text x="1214" y="290" class="small">densities + random walks</text>

  <path d="M245 302 V338 H520 V372" class="arrow"/>
  <path d="M615 302 V372" class="arrow"/>
  <path d="M985 302 V338 H1080 V372" class="arrow"/>
  <path d="M1355 302 V552 H650 V590" class="arrow-soft"/>
  <path d="M1355 302 V552 H1350 V590" class="arrow-soft"/>

  <text x="80" y="350" class="section">2 — OBSERVATION PREPARATION</text>
  <rect x="300" y="372" width="440" height="144" class="box" fill="#ffffff" stroke="#0ea5e9"/>
  <circle cx="333" cy="405" r="19" fill="#0ea5e9"/>
  <text x="327" y="412" class="tag">A</text>
  <text x="365" y="411" class="box-title">Dataset checks</text>
  <text x="330" y="446" class="body">Decoding · temporal order · rate</text>
  <text x="330" y="473" class="body">camera/IMU overlap · gaps</text>
  <text x="330" y="498" class="small">Explicit failure on inconsistent data</text>

  <rect x="860" y="372" width="440" height="144" class="box" fill="#ffffff" stroke="#16a34a"/>
  <circle cx="893" cy="405" r="19" fill="#16a34a"/>
  <text x="887" y="412" class="tag">B</text>
  <text x="925" y="411" class="box-title">AprilGrid detection</text>
  <text x="890" y="446" class="body">Tags → 2D corners → metric 3D points</text>
  <text x="890" y="473" class="body">tracked rejections · tagless frames retained</text>
  <text x="890" y="498" class="small">Deterministic across worker counts</text>
  <path d="M740 444 H860" class="arrow"/>

  <path d="M1080 516 V558 H450 V590" class="arrow"/>
  <path d="M1080 516 V590" class="arrow"/>

  <text x="80" y="568" class="section">3 — INITIALIZATION</text>
  <rect x="220" y="590" width="460" height="154" class="box" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="252" y="629" class="box-title">Intrinsics and target poses</text>
  <text x="252" y="661" class="body">• `--cam`: fixed intrinsics</text>
  <text x="252" y="688" class="body">• `--models`: automatic initialization</text>
  <text x="252" y="715" class="small">T_world_cam estimated for usable frames</text>

  <rect x="850" y="590" width="530" height="154" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="882" y="629" class="box-title">Temporal and inertial initialization</text>
  <text x="882" y="661" class="body">offset grid · angular-velocity alignment</text>
  <text x="882" y="688" class="body">T_cam_imu · gravity · lever arm · biases</text>
  <text x="882" y="715" class="small">Continuous camera trajectory initialized from poses</text>
  <path d="M680 667 H850" class="arrow"/>

  <path d="M1115 744 V786" class="arrow"/>
  <text x="80" y="790" class="section">4 — JOINT OPTIMIZATION</text>
  <rect x="170" y="812" width="1260" height="190" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <rect x="196" y="836" width="166" height="27" rx="13" fill="#ea580c"/>
  <text x="215" y="855" class="tag">CERES · DOUBLE</text>
  <text x="198" y="895" class="box-title">Jointly estimated parameters</text>
  <text x="198" y="928" class="body">Continuous trajectory T_world_cam(t)  ·  T_cam_imu (IMU → camera)  ·  timeshift_cam_imu</text>
  <text x="198" y="958" class="body">gravity direction  ·  constant or piecewise-linear biases under a random-walk prior</text>

  <rect x="915" y="838" width="478" height="132" rx="15" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="942" y="874" class="box-title">Minimized residuals</text>
  <text x="942" y="906" class="body">visual: projection − observation [x, y]</text>
  <text x="942" y="934" class="body">inertial: gyroscope + accelerometer</text>
  <text x="942" y="958" class="small">Robust losses · whitened noise · global CPU budget</text>

  <path d="M520 1002 V1040 H348" class="arrow"/>
  <path d="M800 1002 V1040" class="arrow"/>
  <path d="M1080 1002 V1040 H1252" class="arrow"/>

  <text x="80" y="1046" class="section">5 — CHECKS AND OUTPUTS</text>
  <rect x="80" y="1068" width="510" height="70" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="105" y="1097" class="box-title">Validation</text>
  <text x="105" y="1123" class="small">held-out frames · excitation · rank · marginalized covariance</text>

  <rect x="620" y="1068" width="360" height="70" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="1097" class="box-title">Calibration</text>
  <text x="645" y="1123" class="small">camchain.yaml · calibration.json</text>

  <rect x="1010" y="1068" width="510" height="70" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="1035" y="1097" class="box-title">Matplotlib PDF report</text>
  <text x="1035" y="1123" class="small">3D trajectory · motion · IMU · biases · x/y errors</text>
</svg>
